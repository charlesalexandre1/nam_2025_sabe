<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Escolas com Heatmap</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        :root {
            --primary: #0056b3;
            --bg: #f4f6f9;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
        }

        header {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 15px;
        }

        #mapa {
            height: 80vh;
            width: 100%;
        }

        .container {
            padding: 15px;
        }

        .loading {
            text-align: center;
            margin-top: 10px;
        }

        .legenda {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            z-index: 1000;
            font-size: 0.85em;
            box-shadow: 0 0 6px rgba(0,0,0,0.2);
        }

        .controle {
            position: absolute;
            top: 80px;
            right: 20px;
            z-index: 1000;
        }

        button {
            padding: 8px 12px;
            border: none;
            background: var(--primary);
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #003f88;
        }
    </style>
</head>

<body>

<header>
    <h2>📍 Mapa de Escolas com Heatmap de Alfabetização</h2>
</header>

<div class="container">
    <div id="mapa"></div>
    <div class="loading" id="loading">Carregando dados...</div>
</div>

<!-- Botão -->
<div class="controle">
    <button onclick="alternarHeatmap()">🔥 Alternar Heatmap</button>
</div>

<!-- Legenda -->
<div class="legenda">
    <strong>Legenda:</strong><br>
    🟢 Com alfabetizados<br>
    🔴 Sem alfabetizados<br>
    ⚪ Sem dados<br>
    <hr>
    🔥 Heatmap = intensidade de alfabetização
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<script>
    const map = L.map('mapa').setView([-14.235, -53.132], 5);
    const loading = document.getElementById("loading");

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Ícones
    const iconeVerde = new L.Icon({
        iconUrl: 'https://maps.google.com/mapfiles/ms/icons/green-dot.png',
        iconSize: [32, 32]
    });

    const iconeVermelho = new L.Icon({
        iconUrl: 'https://maps.google.com/mapfiles/ms/icons/red-dot.png',
        iconSize: [32, 32]
    });

    const iconeCinza = new L.Icon({
        iconUrl: 'https://maps.google.com/mapfiles/ms/icons/grey-dot.png',
        iconSize: [32, 32]
    });

    function definirIcone(escola) {
        if (!escola.alfabetometro) return iconeCinza;

        const alfabetico = escola.alfabetometro.qtd_alfabetico || 0;

        return alfabetico > 0 ? iconeVerde : iconeVermelho;
    }

    function criarPopup(escola) {
        let percentual = 0;

        if (escola.alfabetometro) {
            const total = escola.alfabetometro.qtd_alunos_ano || 0;
            const alfabetico = escola.alfabetometro.qtd_alfabetico || 0;
            percentual = total > 0 ? ((alfabetico / total) * 100).toFixed(1) : 0;
        }

        return `
            <strong>${escola.nome}</strong><br>
            📍 ${escola.endereco}<br>
            🏙️ ${escola.localidade}<br>
            👨‍🏫 ${escola.gestor || 'Não informado'}
            <hr>
            ${
                escola.alfabetometro
                
                ? `📊 ${percentual}% alfabetizados`
                : `<em>Sem dados</em>`
                
                
            }
        `;
    }

    let heatData = [];
    let heatLayer;

    function carregarDadosEscolas() {
        fetch("{% url 'dados_escolas_json' %}")
            .then(res => res.json())
            .then(data => {
                loading.style.display = "none";

                const bounds = [];

                data.forEach(escola => {
                    if (escola.latitude && escola.longitude) {

                        const latlng = [escola.latitude, escola.longitude];
                        bounds.push(latlng);

                        // marcador
                        L.marker(latlng, {
                            icon: definirIcone(escola)
                        })
                        .addTo(map)
                        .bindPopup(criarPopup(escola));

                        // heatmap
                        const total = escola.alfabetometro?.qtd_alunos_ano || 0;
                        const alfabetico = escola.alfabetometro?.qtd_alfabetico || 0;
                        const intensidade = total > 0 ? (alfabetico / total) : 0;

                        heatData.push([escola.latitude, escola.longitude, intensidade]);
                    }
                });

                if (bounds.length) {
                    map.fitBounds(bounds);
                }

                // cria heatmap
                heatLayer = L.heatLayer(heatData, {
                    radius: 25,
                    blur: 15,
                    maxZoom: 17
                });

            })
            .catch(err => {
                loading.innerText = "Erro ao carregar dados.";
                console.error(err);
            });
    }

    function alternarHeatmap() {
        if (!heatLayer) return;

        if (map.hasLayer(heatLayer)) {
            map.removeLayer(heatLayer);
        } else {
            map.addLayer(heatLayer);
        }
    }

    carregarDadosEscolas();
</script>

</body>
</html>
